name: careerflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerflow}
      POSTGRES_USER: ${POSTGRES_USER:-careerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerflow-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [careerflow]

  api:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://careerflow:careerflow-dev-password@db:5432/careerflow}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
      AUTH_MODE: ${AUTH_MODE:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_REDACT_VALUES: ${LOG_REDACT_VALUES:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-fixture}
      AI_MODEL: ${AI_MODEL:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/integrations/google/callback}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [careerflow]

  worker:
    build:
      context: ./backend
      dockerfile: Containerfile
    command: ["uv", "run", "python", "-m", "careerflow.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://careerflow:careerflow-dev-password@db:5432/careerflow}
      DEMO_MODE: ${DEMO_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_REDACT_VALUES: ${LOG_REDACT_VALUES:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-fixture}
      AI_MODEL: ${AI_MODEL:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/careerflow-worker.heartbeat')<60 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [careerflow]

  web:
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [careerflow]

networks:
  careerflow:

volumes:
  postgres_data:
