name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: careerflow_test
          POSTGRES_USER: careerflow
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerflow" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      # enables the PostgreSQL-only tests (task-queue concurrency)
      TEST_DATABASE_URL: postgresql+psycopg://careerflow:ci-password@localhost:5432/careerflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: careerflow
          POSTGRES_USER: careerflow
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerflow" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://careerflow:ci-password@localhost:5432/careerflow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - name: Drift check (models vs migrations)
        run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up -d --build
      - run: curl --fail --retry 20 --retry-connrefused http://localhost:8000/health/ready
      - run: curl --fail --retry 20 --retry-connrefused http://localhost:5173/
      - name: Worker is running and healthy
        run: |
          for i in $(seq 1 30); do
            state=$(docker compose ps --format '{{.Service}} {{.Health}}' worker)
            echo "$state"; echo "$state" | grep -q healthy && exit 0; sleep 3
          done
          docker compose logs worker; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: E2E (Playwright, against the freshly seeded stack)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: always()
        run: docker compose down -v

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (OCI)
        run: docker build -f backend/Containerfile -t careerflow-api:ci backend
      - name: Build frontend image (OCI)
        run: docker build -f frontend/Containerfile -t careerflow-web:ci frontend
      - run: docker compose config --quiet

  podman:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROVIDER_WARNING_SILENCE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Rootless podman info
        run: |
          podman --version
          podman info --format '{{.Host.Security.Rootless}}'
      - name: Start the Podman API socket (podman compose delegates to docker-compose)
        run: |
          podman system service --time=0 unix:///tmp/podman.sock &
          for i in $(seq 1 20); do [ -S /tmp/podman.sock ] && break; sleep 1; done
          echo "DOCKER_HOST=unix:///tmp/podman.sock" >> "$GITHUB_ENV"
      - run: podman compose config
      - run: podman compose up -d --build
      - run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8000/health/ready
      - run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:5173/
      - if: always()
        run: podman compose logs --tail 50 || true
      - if: always()
        run: podman compose down -v
