[project]
name = "careerflow-backend"
version = "0.1.0"
description = "CareerFlow API"
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.32,<1.0",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "cryptography>=43,<47",
]

[dependency-groups]
dev = [
  "alembic>=1.14,<2.0",
  "mypy>=1.13,<2.0",
  "types-defusedxml>=0.7",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "types-pyyaml>=6.0.12.20261113",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["careerflow"]

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true  # reportlab ships no type information

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/careerflow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
